<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ascii Display</title>
</head>
<body>
    <div>
        <!--display the error code as heading 1-->
        <div class="mb-1">
            <h1>{{.ErrorCode}}</h1>
        </div>
    </div>
    <div>
        <!--Display the error massage to the screen -->
        <div class="mb-1">
            <p><i>{{.ErrorMsg}}</i></p>
        </div>
    </div>
</body>
</html>
